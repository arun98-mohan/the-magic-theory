spring.application.name=the-magic-theory

# Prefer env vars in deployment. For local IntelliJ runs, activate the
# "local" Spring profile (loads gitignored application-local.properties).
spring.datasource.url=${DATABASE_JDBC_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Keep the pool small; Railway Postgres has a low connection limit.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000

# API JSON uses snake_case (matches the event payload shape: event_id, ...).
spring.jackson.property-naming-strategy=SNAKE_CASE
# Allow POST /api/events to accept a single event object as well as an array.
spring.jackson.deserialization.accept-single-value-as-array=true

server.port=${PORT:8080}

# Railway (and other reverse proxies) terminate TLS and forward X-Forwarded-*.
# Without this, Swagger/OpenAPI advertise http:// URLs and the browser blocks
# Try-it-out as mixed content ("Failed to fetch" / fake CORS).
server.forward-headers-strategy=framework
